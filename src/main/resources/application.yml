# application.yml
# ---------------------------------------------------------------------------
# Spring Boot reads this file at startup to configure itself. YAML uses
# indentation for nesting; "spring.datasource.url" below is the same as
# writing spring.datasource.url=... in a .properties file.
#
# ${ENV_VAR:default} means: use the environment variable if set, otherwise
# fall back to the value after the colon. This lets the same file work on
# your laptop and on a deployed server without edits.
# ---------------------------------------------------------------------------

spring:
  application:
    name: ticketflow

  # --- How to reach PostgreSQL (must match docker-compose.yml) ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketflow}
    username: ${DB_USER:ticketflow}
    password: ${DB_PASSWORD:ticketflow}
    hikari:
      # Connection pool size. Hikari's default is 10; under a burst of concurrent
      # holds that leaves requests queuing for a connection. 30 measurably
      # improved p95 latency and throughput in the Phase 8 load test.
      maximum-pool-size: ${DB_POOL_SIZE:30}

  # --- JPA / Hibernate: the layer that maps Java objects to DB tables ---
  jpa:
    hibernate:
      # "validate" = on startup, check that our @Entity classes match the
      # tables Flyway created, but NEVER create or alter tables itself.
      # Flyway owns the schema. This is deliberate (CLAUDE.md §3).
      ddl-auto: validate
    open-in-view: false     # avoid keeping a DB session open during view rendering; a common footgun
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --- Flyway: runs versioned .sql migration files from
  #     src/main/resources/db/migration on startup, in order (V1, V2, ...) ---
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Redis connection (used from Phase 5 onward) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# --- Actuator: exposes operational endpoints. We only open "health" and
#     "info". /actuator/health returning UP is the Phase 0 acceptance check. ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always   # show component status (db, redis) — handy while learning

# --- Logging: make Flyway and SQL chatter visible while we build ---
logging:
  level:
    org.flywaydb: info

# --- Our own application settings (not a Spring key — "app" is a namespace we
#     invented and bind to in JwtService). ---
app:
  jwt:
    # HS256 signing needs a key of at least 32 bytes. This dev default is fine
    # locally; a real deployment MUST set JWT_SECRET to a random secret.
    secret: ${JWT_SECRET:dev-only-change-me-please-a-long-random-string-0123456789}
    # How long an issued token stays valid. 24 hours, in milliseconds.
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  hold:
    # How long a seat hold lasts. ISO-8601 duration ("PT8M" = 8 minutes).
    # Override with APP_HOLD_DURATION=PT20S to watch expiry happen quickly.
    duration: ${APP_HOLD_DURATION:PT8M}
    # How often the background sweeper releases expired holds.
    sweep-interval-ms: ${APP_HOLD_SWEEP_INTERVAL_MS:30000}
